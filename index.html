<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <p>A function can access variables defined inside the function:</p>
    <button type="button" onclick="myFunction()">Click Me!</button>
    <p id="demo"></p>
    <p id="demo1"></p>
    <p id="demo2"></p>
    <script>
        var b = 5; // Global variable
        function myFunction() {
            var a = 4; // Local variable; available only inside this function
            document.getElementById("demo").textContent = b * a;
            document.getElementById("demo1").textContent =
                "The function ran. a is local to myFunction().";
        }
        // b is global, so it can be accessed outside the function.
        document.getElementById("demo2").textContent = b;
    </script>
</body>
</html>
